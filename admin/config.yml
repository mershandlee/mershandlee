backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projects"
    label: "Projects"
    files:
      - name: "projects"
        label: "Projects"
        file: "projects.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Meta", name: "meta", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "markdown", required: false }
              - { label: "Welcome Preview Image", name: "welcomeImage", widget: "image", required: false }
              - { label: "Images", name: "images", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
              - { label: "Videos", name: "videos", widget: "list", required: false, field: { label: "Video", name: "video", widget: "file" } }

  - name: "writings"
    label: "Writings"
    files:
      - name: "writings"
        label: "Writings"
        file: "writings.json"
        fields:
          - label: "Writings"
            name: "writings"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Meta", name: "meta", widget: "string" }
              - { label: "Excerpt", name: "excerpt", widget: "text" }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About"
        file: "about.json"
        fields:
          - { label: "About Image", name: "image", widget: "image", required: false }
          - label: "Bios"
            name: "paragraphs"
            widget: "list"
            field:
              label: "Bio / Paragraph"
              name: "paragraph"
              widget: "text"
