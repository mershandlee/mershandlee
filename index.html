<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="mershandlee is a Vienna-based architecture and design studio founded in 2017.">
  <title>Works | mershandlee</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  
  <style>
    @font-face {
  font-family: 'Infini';
  src: url('/infini-romain.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
}

@font-face {
  font-family: 'Infini';
  src: url('/infini-gras.otf') format('opentype');
  font-weight: 900;
  font-style: normal;
}

@font-face {
  font-family: 'Infini';
  src: url('/infini-italique.otf') format('opentype');
  font-weight: 400;
  font-style: italic;
}
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      font-family: 'Infini', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #000;
      background: #fff;
    }
    
    .wrapper {
      display: flex;
      min-height: 100vh;
    }
    
    .sidebar {
      width: 470px;
      padding: 30px 20px 60px 60px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
    }
    
    .logo {
      font-size: 85px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 0;
      letter-spacing: -3px;
      flex-grow: 1;
      display: flex;
      align-items: flex-start;
      padding-top: 20px;
    }
    
    .sidebar-footer {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    
    nav {
      display: flex;
      gap: 20px;
      font-size: 21px;
      font-weight: 900;`
    }
    
    nav button {
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 500;
      color: #000;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
    }
    
    nav button:hover {
      opacity: 0.6;
    }
    
    .main {
      width: calc(100% - 470px);
      margin-left: 470px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .main-content {
      flex: 1;
      padding: 250px 0 60px 0;
      display: flex;
      flex-direction: column;
      overflow-y: hidden;
    }
    
    .page {
      display: none;
      width: 100%;
    }
    
    .page.active {
      display: flex;
      flex-direction: column;
    }
    
    .projects-scroll {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 100px;
    }
    
    .project-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    
    .project-section:hover {
      opacity: 0.8;
    }
    
    .project-image {
      width: 90%;
      max-width: 600px;
      height: 500px;
      background: transparent;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #ccc;
      overflow: hidden;
    }
    
    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .project-title {
      font-size: 18px;
      font-weight: 600;
    }

/* PREVIEW LANDING PAGE */

.projects-stage {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: 1fr 2fr;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* WHITE LEFT THIRD */

.projects-home-white {
  position: relative;
  background: #fff;
  padding: 50px 60px;
}

.projects-home-logo {
  width: 340px;
  max-width: 80%;
  height: auto;
  display: block;
}

.projects-home-email {
  position: absolute;
  left: 60px;
  bottom: 50px;
  color: #000;
  text-decoration: none;
  font-size: 14px;
}

/* WARM YELLOW RIGHT TWO THIRDS */

.projects-home-yellow {
  position: relative;
  background: #d6ce8f;
  width: 100%;
  height: 100vh;
  display: grid;
  grid-template-columns: 55% 45%;
  padding: 7vh 4vw 7vh 3vw;
  overflow: hidden;
}

/* PROJECT NAMES */

.project-menu {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.project-menu-item {
  display: block;
  width: fit-content;
  max-width: 100%;
  border: 0;
  background: transparent;
  padding: 0;

  font-family: 'Infini', sans-serif;
  font-size: clamp(25px, 2.1vw, 38px);
  font-weight: 900;
  line-height: 1;
  color: #000;
  text-align: left;

  cursor: pointer;
}

/* IMAGE ON RIGHT SIDE OF YELLOW */

.project-preview-area {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.project-preview-image {
  width: auto;
  height: auto;
  max-width: 82%;
  max-height: 65vh;
  object-fit: contain;

  opacity: 0;
  transform: translateX(45px);
  transition:
    opacity 0.18s ease,
    transform 0.4s ease;
}

.project-preview-image.is-visible {
  opacity: 1;
  transform: translateX(0);
}
    
    .project-detail-page {
      width: 100%;
      max-width: none;
    }
    
    .back-link {
      display: none;
    }
    
    .back-link:hover {
      color: #000;
    }
    
    .detail-title {
      display: none;
    }
    
    .detail-meta {
      display: none;
    }
    
.image-gallery {
  position: relative;
  width: 100%;
  height: 600px;
  margin-bottom: 30px;
  overflow: hidden;
  cursor: pointer;
}

.image-gallery::-webkit-scrollbar {
  display: none;
}

.gallery-image {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(calc(-50% + 100vw), -50%);
  transition: transform 0.7s ease;
}

.gallery-image.arrived:first-child {
  transform: translate(-50%, -50%);
}

.gallery-image.arrived:nth-child(4n+2) {
  transform: translate(calc(-50% + 10px), calc(-50% - 6px));
}

.gallery-image.arrived:nth-child(4n+3) {
  transform: translate(calc(-50% - 8px), calc(-50% + 9px));
}

.gallery-image.arrived:nth-child(4n) {
  transform: translate(calc(-50% + 6px), calc(-50% + 12px));
}

.gallery-image.arrived:nth-child(4n+1):not(:first-child) {
  transform: translate(calc(-50% - 10px), calc(-50% - 4px));
}

.gallery-image img {
  width: auto;
  height: auto;
  max-width: 80vw;
  max-height: 600px;
  display: block;
  max-width: none;
}

.gallery-more {
  position: fixed;
  z-index: 9999;
  display: none;
  align-items: stretch;
  padding: 0;
  background: transparent;
  border: none;
  pointer-events: none;
  color: #000;
}

.stamp-label {
  font-family: 'Infini', 'Courier New', monospace;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.7px;
  padding: 2px 2px 2px 5px;
  background: #fff;
  display: flex;
  align-items: center;
}

.gallery-dots {
  display: block;
  width: 24px;
  align-self: stretch;
  background:
    radial-gradient(
      circle at center,
      transparent 0 2px,
      #000 2.1px 2.7px,
      #fff 2.8px
    )
    0 0 / 8px 100% repeat-x;
  box-shadow: 5px 0 0 #fff;
}
    
.gallery-dots::after {
  content: "";
  width: 5px;
  background: #fff;
}
    
.gallery-dot {
  display: none;
}
    
    .detail-description {
      font-size: 14px;
      line-height: 1.8;
      color: #333;
      text-align: left;
      width: 100%;
    }
    
    .writings-content {
      width: 100%;
      max-width: 700px;
    }
    
    .writing-section {
      margin-bottom: 80px;
      padding-bottom: 80px;
      border-bottom: 1px solid #f0f0f0;
      text-align: center;
    }
    
    .writing-section:last-child {
      border-bottom: none;
    }
    
    .writing-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .writing-meta {
      font-size: 12px;
      color: #999;
      margin-bottom: 12px;
    }
    
    .writing-excerpt {
      font-size: 13px;
      color: #666;
      line-height: 1.7;
    }
    
    .about-content {
      width: 100%;
      max-width: 700px;
    }
    
    .about-text {
      font-size: 14px;
      line-height: 1.8;
      color: #333;
      margin-bottom: 24px;
      text-align: center;
    }
    
    .main-footer {
      padding: 40px 60px 60px 0;
      text-align: right;
      font-size: 14px;
    }
    
    .main-footer a {
      color: #000;
      text-decoration: none;
    }
.welcome-page {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: white;
  padding: 50px 60px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.welcome-logo {
  width: 340px;
}

.welcome-logo-image {
  width: 100%;
  height: auto;
  display: block;
}

.welcome-message {
  font-size: 18px;
}

.welcome-email {
  color: black;
  text-decoration: none;
  font-size: 14px;
  align-self: flex-end;
}

.wrapper {
  display: none;
}  

 @media (max-width: 768px) {
  .welcome-page {
    padding: 25px 20px;
  }

  .welcome-logo {
    width: 230px;
  }

  .welcome-logo-image {
    width: 100%;
    height: auto;
  }

  .welcome-message {
    font-size: 16px;
  }

  .welcome-email {
    font-size: 13px;
  }
}
</style>
</head>
<body>
  
 <div class="welcome-page">
  <div class="welcome-logo">
    <img src="/images/uploads/mershandlee_logo-.png" alt="mershandlee logo" class="welcome-logo-image">
  </div>

  <div class="welcome-message">
    Our new website is coming soon.
  </div>

  <a class="welcome-email" href="mailto:studio@mershandlee.com">
    studio@mershandlee.com
  </a>
</div>

  <div class="wrapper">
    <div class="sidebar">
      <div class="logo">
  <img src="/images/uploads/mershandlee_logo-.jpg" alt="mershandlee logo" class="site-logo-image">
</div>
      <div class="sidebar-footer">
        <nav>
          <button onclick="showPage('projects')">Projects</button>
          <button onclick="showPage('about')">About</button>
          <button onclick="showPage('writings')">Writings</button>
        </nav>
      </div>
    </div>

    <div class="main">
      <div class="main-content">
        <div id="projects" class="page active">
          <div class="projects-scroll" id="projectsList"></div>
        </div>

        <div id="project-detail" class="page">
          <div class="project-detail-page">
            <span class="back-link" onclick="showPage('projects')">← back to projects</span>
            <h1 class="detail-title" id="detailTitle"></h1>
            <div class="detail-meta" id="detailMeta"></div>
            <div class="image-gallery"
              onclick="nextProjectImage()" id="detailGallery"
              onmousemove="moveGalleryLabel(event)"
              onmouseenter="showGalleryLabel()"
              onmouseleave="hideGalleryLabel()"></div>
            <div class="gallery-more" id="galleryMore"></div>
            <div class="detail-description" id="detailDescription"></div>
          </div>
        </div>

        <div id="writings" class="page">
          <div class="writings-content" id="writingsContent"></div>
        </div>

        <div id="about" class="page">
          <div class="about-content" id="aboutContent"></div>
        </div>
      </div>
      
      <div class="main-footer">
        <a href="mailto:studio@mershandlee.com">studio@mershandlee.com</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <script>
    const projectSlugs = [
      'rewildingtheground',
      'cityofmanyacts',
      'silentwitness',
      'plusminuswall',
      'nikizbookshop',
      'diamondtowall',
      'thisisthat',
      'oblique',
      'misfitqualities',
      'vaseovalandtriangle',
      'wallhouse2',
      'palaisdeTokyo',
      'possibleactualities',
      'micromega',
      'proun',
      'seoulbiennale',
      'objectbuilding'
    ];

    let allProjects = [];
    let allWritings = [];
    let aboutData = {};
    let currentProject = null;
    let currentImageIndex = 0;
    
    async function loadProjects() {
      try {
        const response = await fetch('projects.json');
        const data = await response.json();
        allProjects = data.projects || [];
        renderProjects();
      } catch (error) {
        console.error('Error loading projects:', error);
      }
    }

    async function loadWritings() {
      try {
        const writings = await fetch('writings.json').then(r => r.json());
        allWritings = writings.writings || [];
        renderWritings();
      } catch (error) {
        console.error('Error loading writings:', error);
      }
    }

    async function loadAbout() {
      try {
        const about = await fetch('about.json').then(r => r.json());
        aboutData = about;
        renderAbout();
      } catch (error) {
        console.error('Error loading about:', error);
      }
    }

function renderProjects() {
  const container = document.getElementById('projectsList');

  const projectNames = allProjects.map((project, index) => `
    <button
      class="project-menu-item"
      onmouseenter="previewProject(${index})"
      onmouseleave="hideProjectPreview()"
      onclick="showProjectDetail('${project.slug}')">
      ${project.title}
    </button>
  `).join('');

  container.innerHTML = `
    <div class="projects-stage">

      <div class="projects-home-white">

        <img
          class="projects-home-logo"
          src="/images/uploads/mershandlee_logo-.png"
          alt="mershandlee">

        <a
          class="projects-home-email"
          href="mailto:studio@mershandlee.com">
          studio@mershandlee.com
        </a>

      </div>

      <div class="projects-home-yellow">

        <div class="project-menu">
          ${projectNames}
        </div>

        <div class="project-preview-area">
          <img
            id="projectPreviewImage"
            class="project-preview-image"
            alt="">
        </div>

      </div>

    </div>
  `;
}


function previewProject(index) {
  const project = allProjects[index];
  const preview = document.getElementById('projectPreviewImage');

  if (!project || !project.images || !project.images[0] || !preview) return;

  preview.classList.remove('is-visible');
  preview.src = project.images[0];
  preview.alt = project.title;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      preview.classList.add('is-visible');
    });
  });
}


function hideProjectPreview() {
  const preview = document.getElementById('projectPreviewImage');

  if (preview) {
    preview.classList.remove('is-visible');
  }
}
    
    function renderWritings() {
      const container = document.getElementById('writingsContent');
      container.innerHTML = allWritings.map(writing => `
        <div class="writing-section">
          <div class="writing-title">${writing.title}</div>
          <div class="writing-meta">${writing.meta}</div>
          <div class="writing-excerpt">${writing.excerpt}</div>
        </div>
      `).join('');
    }

    function renderAbout() {
      const container = document.getElementById('aboutContent');
      container.innerHTML = (aboutData.paragraphs || [])
        .map(para => `<p class="about-text">${para}</p>`)
        .join('');
    }

    function showProjectDetail(slug) {
      const project = allProjects.find(p => p.slug === slug);
      if (!project) return;

      document.getElementById('detailTitle').textContent = project.title;
      document.getElementById('detailMeta').textContent = project.meta || '';
      
     currentProject = project;
     currentImageIndex = 0;

     const gallery = document.getElementById('detailGallery');

     gallery.innerHTML = (project.images || [])
      .map((img, index) => `
        <div class="gallery-image ${index === 0 ? 'arrived' : ''}" style="z-index:${index + 1}">
         <img src="${img}" alt="${project.title}">
        </div>
     `)
     .join('');

updateGalleryMore();
      
      document.getElementById('detailDescription').innerHTML = 
        marked.parse(project.description || '', { breaks: true });

      showPage('project-detail');
    }

function updateGalleryMore() {
  const images = currentProject?.images || [];
  const label = document.getElementById('galleryMore');

  if (images.length < 2) {
    label.innerHTML = '';
    return;
  }

  const dots = `<span class="gallery-dot"></span><span class="gallery-dot"></span><span class="gallery-dot"></span>`;

  label.innerHTML = `
    <span class="stamp-label">(&amp;) more</span>
    <div class="gallery-dots">${dots}</div>
  `;
}

function moveGalleryLabel(event) {
  const label = document.getElementById('galleryMore');
  label.style.left = `${event.clientX + 18}px`;
  label.style.top = `${event.clientY + 18}px`;
}

function showGalleryLabel() {
  document.getElementById('galleryMore').style.display = 'flex';
}

function hideGalleryLabel() {
  document.getElementById('galleryMore').style.display = 'none';
}

function nextProjectImage() {
  const images = currentProject?.images || [];
  if (images.length < 2) return;

  const gallery = document.getElementById('detailGallery');
  const nextIndex = (currentImageIndex + 1) % images.length;
  const firstCycle = gallery.children.length === images.length && nextIndex !== 0;

  if (firstCycle) {
    gallery.children[nextIndex].classList.add('arrived');
  } else {
    const original = gallery.children[nextIndex];
    const newImage = original.cloneNode(true);

    newImage.classList.remove('arrived');
    newImage.style.zIndex = gallery.children.length + 1;
    gallery.appendChild(newImage);

    requestAnimationFrame(() => {
      newImage.classList.add('arrived');
    });
  }

  currentImageIndex = nextIndex;
  updateGalleryMore();
}
    
    function showPage(pageName) {
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });
      document.getElementById(pageName).classList.add('active');
      document.querySelector('.main-content').scrollTop = 0;
    }

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

const SITE_LIVE = false;
const PREVIEW_MODE =
  new URLSearchParams(window.location.search).get('preview') === '1';

if (SITE_LIVE || PREVIEW_MODE) {
  document.querySelector('.welcome-page').style.display = 'none';
  document.querySelector('.wrapper').style.display = 'flex';

  loadProjects();
  loadWritings();
  loadAbout();
}
  </script>

</body>
</html>
