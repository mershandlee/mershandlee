.image-gallery {
  position: relative;
  width: 100%;
  height: 600px;
  margin-bottom: 30px;
  overflow: hidden;
  cursor: none;
}

.image-gallery::-webkit-scrollbar {
  display: none;
}

.gallery-image {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(calc(-50% + 100vw), -50%);
  transition: transform 0.7s ease;
}

.gallery-image.arrived:first-child {
  transform: translate(-50%, -50%);
}

.gallery-image.arrived:nth-child(4n+2) {
  transform: translate(calc(-50% + 10px), calc(-50% - 6px));
}

.gallery-image.arrived:nth-child(4n+3) {
  transform: translate(calc(-50% - 8px), calc(-50% + 9px));
}

.gallery-image.arrived:nth-child(4n) {
  transform: translate(calc(-50% + 6px), calc(-50% + 12px));
}

.gallery-image.arrived:nth-child(4n+1):not(:first-child) {
  transform: translate(calc(-50% - 10px), calc(-50% - 4px));
}

.gallery-image img {
  width: auto;
  height: auto;
  max-width: 80vw;
  max-height: 600px;
  display: block;
  max-width: none;
}

.gallery-image video {

function updateProjectsHoverScrollbar() {
  const menu = document.getElementById('projectsHoverMenu');

  if (!menu) return;

  const content =
    menu.querySelector('.projects-hover-scroll-content');

  const track =
    menu.querySelector('.projects-hover-scroll-track');

  const thumb =
    menu.querySelector('.projects-hover-scroll-thumb');

  if (!content || !track || !thumb) return;

  const maxScroll =
    content.scrollHeight - content.clientHeight;

  if (maxScroll <= 0) {
    thumb.style.display = 'none';
    return;
  }

  thumb.style.display = 'block';

  const visibleRatio =
    content.clientHeight / content.scrollHeight;

  const thumbHeight = Math.max(
    18,
    track.clientHeight * visibleRatio
  );

  const maxThumbMovement =
    track.clientHeight - thumbHeight;

  const thumbPosition =
    (content.scrollTop / maxScroll) * maxThumbMovement;

  thumb.style.height = `${thumbHeight}px`;
  thumb.style.transform =
    `translateY(${thumbPosition}px)`;
}

    const left = Math.max(

        rect.left,
        window.innerWidth - menu.offsetWidth - 20

    menu.style.left = `${left}px`;
    menu.style.top = `${top}px`;

    updateProjectsHoverScrollbar();

    src: src
  }));

  const videos = (project.videos || []).map(src => ({
    type: 'video',
    src: src
  }));

  return [...images, ...videos];
}
    
    function showProjectDetail(slug) {
      const project = allProjects.find(p => p.slug === slug);
      if (!project) return;

      document.getElementById('detailTitle').textContent = project.title;
      document.getElementById('detailMeta').textContent = project.meta || '';
      
     currentProject = project;
     currentImageIndex = 0;

     const gallery = document.getElementById('detailGallery');
const media = getProjectMedia(project);

gallery.innerHTML = media
  .map((item, index) => `
    <div class="gallery-image ${index === 0 ? 'arrived' : ''}" style="z-index:${index + 1}">
      ${
        item.type === 'video'
          ? `<video src="${item.src}" autoplay loop muted playsinline preload="auto"></video>`
          : `<img src="${item.src}" alt="${project.title}">`
      }
    </div>
  `)
  .join('');

updateGalleryMore();
      
      document.getElementById('detailDescription').innerHTML = 
        marked.parse(project.description || '', { breaks: true });

      showPage('project-detail');
    }

function updateGalleryMore() {
  const media = getProjectMedia(currentProject);
  const label = document.getElementById('galleryMore');

  if (media.length < 2) {
    label.innerHTML = '';
    return;
  }

  label.innerHTML = `
    <img src="/images/uploads/crouser.png" alt="">
  `;
}

function moveGalleryLabel(event) {
  const label = document.getElementById('galleryMore');
  label.style.left = `${event.clientX}px`;
  label.style.top = `${event.clientY}px`;
}

function showGalleryLabel() {
  document.getElementById('galleryMore').style.display = 'flex';
}

function hideGalleryLabel() {
  document.getElementById('galleryMore').style.display = 'none';
}

function nextProjectImage() {
  const media = getProjectMedia(currentProject);
  if (media.length < 2) return;

  const gallery = document.getElementById('detailGallery');

  const nextIndex = (currentImageIndex + 1) % media.length;
  const firstCycle = gallery.children.length === media.length && nextIndex !== 0;

  if (firstCycle) {
    gallery.children[nextIndex].classList.add('arrived');
  } else {
    const original = gallery.children[nextIndex];
    const newImage = original.cloneNode(true);

    newImage.classList.remove('arrived');
    newImage.style.zIndex = gallery.children.length + 1;
    gallery.appendChild(newImage);

    requestAnimationFrame(() => {
      newImage.classList.add('arrived');
    });
  }

  currentImageIndex = nextIndex;
  updateGalleryMore();
}
    
  function showPage(pageName) {
  document.querySelectorAll('.page').forEach(page => {
    page.classList.remove('active');
  });

  document.getElementById(pageName).classList.add('active');
  document.querySelector('.main-content').scrollTop = 0;

  requestAnimationFrame(() => {
    if (pageName === 'projects') {
      updateProjectScrollIndicator();
    }

    if (pageName === 'writings') {
      updateWritingsScrollIndicator();
    }

    if (pageName === 'about') {
      updateAboutScrollIndicator();
    }
  });
}

    const SITE_LIVE = false;

const PREVIEW_MODE =
  new URLSearchParams(window.location.search).get('preview') === '1';

if (SITE_LIVE || PREVIEW_MODE) {
  document.querySelector('.welcome-page').style.display = 'none';
  document.querySelector('.wrapper').style.display = 'flex';

  loadProjects();
  loadWritings();
  loadAbout();
}

if (
  window.netlifyIdentity &&
  typeof window.netlifyIdentity.on === 'function'
) {
  window.netlifyIdentity.on("init", user => {
    if (!user) {
      window.netlifyIdentity.on("login", () => {
        document.location.href = "/admin/";
      });
    }
  });
}
  </script>
